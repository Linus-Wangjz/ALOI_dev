[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aloi"
version = "0.1.0"
description = "A metadata-only lowering prototype for Llama2-70B on heterogeneous PIM systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=5.4",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=0.942",
    "ruff>=0.8",
]

[project.scripts]
aloi-compile = "aloi.cli.compile:main"

[tool.setuptools.packages.find]
include = ["aloi*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
